name: Build and deploy Next.js app to Azure Web App - eshwarhomeneeds-instance

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js standalone
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyDmCD5hpSXfjdriCV0qHX0cOahKYOEM_kE"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "eshwar-home-needs-92d6c.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "eshwar-home-needs-92d6c"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "eshwar-home-needs-92d6c.firebasestorage.app"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "672525700558"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:672525700558:web:0c95cab14eedb7531f6f9f"
          NEXT_PUBLIC_WHATSAPP_NUMBER: "919949408061"
          NEXT_PUBLIC_RAZORPAY_KEY_ID: "rzp_test_TR7tAfXCNzKyXk"

      - name: Copy static files to standalone folder
        run: |
          cp -R .next/static .next/standalone/.next/
          cp -R public .next/standalone/ || true
          cp data-local.json .next/standalone/ || true

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .next/standalone

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./app-deploy
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DCBB7551872746E3982995318F3B4103 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CC02DA99A38B4E47BD21175594B89397 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E3FDD3F1E7C243DFB4F40443CBC0AFFB }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'eshwarhomeneeds-instance'
          slot-name: 'Production'
          package: ./app-deploy